[project]
name = "databricks-to-pbi"
version = "0.1.0"
description = "Sync Databricks semantic layer (Metric Views, AI/BI, Genie) into Power BI semantic models."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "click>=8.1",
  "databricks-sdk>=0.30",
  "anthropic>=0.40",
  "structlog>=24.4",
  "pyyaml>=6.0",
  "azure-identity>=1.18",
  "requests>=2.32",
  # App runtime deps live in main `dependencies` (not optional `app` extras)
  # because the Databricks Apps deploy platform runs `uv sync` without
  # `--extra app`, so anything in optional groups gets skipped at runtime.
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sse-starlette>=2.1",
  "prometheus-client>=0.21",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "pytest-mock>=3.14",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
  "responses>=0.25",
  "types-requests>=2.32",
  "httpx>=0.27",
  "asgi-lifespan>=2.1",
]

[project.scripts]
databricks-to-pbi = "databricks_to_pbi.cli:main"

[tool.uv]
# Don't build/install the project itself — only its dependencies. The
# app.yaml sets PYTHONPATH=src so the modules are importable at runtime
# without packaging. Dependencies resolve from the default public PyPI,
# so the App deploy build works in any workspace with outbound internet.
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "C4", "PTH", "RET"]

[tool.mypy]
strict = true
files = ["src", "tests"]
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["live: tests that hit real Databricks/Anthropic APIs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
